      '" aria-pressed="' + (chon ? 'true' : 'false') + '">' + (chon ? '✓ ' : '') + ds[i][1] + '</button>';
  }
  h += '</div>' + dongLoiTk(nhap, 'loai') + '</div>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-tk-so">' +
    (laTkNo(nhap.loai) ? 'Dư nợ hiện tại (đang nợ bao nhiêu, chưa nợ thì gõ 0)' : 'Số dư hiện tại') + '</label>' +
    '<input id="o-tk-so" class="o o-so-tk" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="' + thoatHtml(nhap.chuSoDu) + '">' +
    '<div id="xem-tk-so" class="xem-tien" aria-live="polite">' + phanXemTk(nhap) + '</div></div>';
  return h + dungChanTk(nhap, '💾 Lưu tài khoản') + '</div>';
}

function dungHopSoDu(du, maTk, chuSo, loi, trang) {
  trang = trang || {};
  var tk = timTk(du, maTk);
  if (!tk) {
    return '<div class="hop nho" role="dialog" aria-modal="true"><p class="goi-y">' + thoatHtml(CHU_LOI_KHONG_THAY) + '</p>' +
      '<div class="chan-hop"><button class="nut" type="button" data-hd="tk-dong">Đóng</button></div></div>';
  }
  var the = laTkNo(tk.loai);
  var soDu = Number(tk.soDu) || 0;
  return '<div class="hop" role="dialog" aria-modal="true" aria-label="Sửa số dư">' + dauHopTk('🔄 Sửa số dư · ' + tk.ten) +
    '<p class="goi-y">👉 Mở app ngân hàng xem số dư thật rồi gõ vào đây. Em sẽ ghi một khoản "Sửa số dư" cho khớp, không tính là chi hay thu.</p>' +
    '<p class="so-trong-so">' + (the ? 'Dư nợ trong sổ: ' + dinhDangTien(-soDu) : 'Số dư trong sổ: ' + dinhDangTien(soDu)) + '</p>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-tk-so">' + (the ? 'Dư nợ thật' : 'Số dư thật') + '</label>' +
    '<input id="o-tk-so" class="o o-so-tk" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="' + thoatHtml(chuSo) + '">' +
    '<div id="xem-tk-so" class="xem-tien" aria-live="polite">' + phanXemSoDu(du, maTk, chuSo, loi) + '</div></div>' +
    dungChanTk({ dangLuu: !!trang.dangLuu, loiLuu: trang.loiLuu || '' }, '💾 Lưu số dư') + '</div>';
}

function dungHopDoiTen(du, nhap) {
  nhap = nhap || {};
  return '<div class="hop" role="dialog" aria-modal="true" aria-label="Đổi tên hoặc ẩn tài khoản">' + dauHopTk('✏️ Đổi tên / ẩn') +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-tk-ten">Tên tài khoản</label>' +
    '<input id="o-tk-ten" class="o" type="text" autocomplete="off" value="' + thoatHtml(nhap.ten) + '">' + dongLoiTk(nhap, 'ten') + '</div>' +
    '<div class="nhom-nhap"><label class="dong-an"><input type="checkbox" id="o-tk-an"' + (nhap.an ? ' checked' : '') + '><span>' +
    (nhap.daAn ? 'Đang ẩn — bỏ đánh dấu để hiện lại' : 'Ẩn tài khoản này (đã đóng, không dùng nữa)') + '</span></label>' +
    '<span class="nhan-nho">Chỉ ẩn được khi số dư bằng 0.</span></div>' +
    dungChanTk(nhap, '💾 Lưu') + '</div>';
}

function dungHopTk(du, nhap) {
  if (nhap.kieu === 'so-du') return dungHopSoDu(du, nhap.ma, nhap.chuSoDu, nhap.loi && nhap.loi.soDu, nhap);
  if (nhap.kieu === 'ten') return dungHopDoiTen(du, nhap);
  return dungHopTaiKhoan(du, nhap);
}

/* ---- chạm document ---- */

function veHopTk() {
  if (typeof document === 'undefined' || !NHAP_TK) return;
  var lop = document.getElementById('lop-phu');
  if (!lop) return;
  var cu = lop.querySelector('.hop');
  var cuon = cu ? cu.scrollTop : 0;
  lop.innerHTML = dungHopTk(TT.duLieu, NHAP_TK);
  var moi = lop.querySelector('.hop');
  if (moi) moi.scrollTop = cuon;
}

function capNhatXemTk() {
  if (typeof document === 'undefined' || !NHAP_TK) return;
  var el = document.getElementById('xem-tk-so');
  if (!el) return;
  el.innerHTML = NHAP_TK.kieu === 'so-du' ? phanXemSoDu(TT.duLieu, NHAP_TK.ma, NHAP_TK.chuSoDu, '') : phanXemTk(NHAP_TK);
}

function dongHopTk() {
  NHAP_TK = null;
  dongHop();
}

function nhapTkMoi(kieu, tk) {
  return {
    kieu: kieu, ma: tk ? tk.ma : '', ten: tk ? String(tk.ten) : '', loai: tk ? tk.loai : '', chuSoDu: '',
    an: tk ? !!tk.an : false, daAn: tk ? !!tk.an : false, dangLuu: false, loiLuu: '', loi: {}
  };
}

function moHopTaiKhoan() {
  var du = TT.duLieu;
  if (!du || NHAP_TK) return;
  NHAP_TK = nhapTkMoi('them', null);
  moHop(dungHopTk(du, NHAP_TK));
}

function moHopSoDu(ma) {
  var du = TT.duLieu;
  var tk = timTk(du, ma);
  if (!tk || NHAP_TK) return;
  NHAP_TK = nhapTkMoi('so-du', tk);
  moHop(dungHopTk(du, NHAP_TK));
}

function moHopDoiTen(ma) {
  var du = TT.duLieu;
  var tk = timTk(du, ma);
  if (!tk || NHAP_TK) return;
  NHAP_TK = nhapTkMoi('ten', tk);
  moHop(dungHopTk(du, NHAP_TK));
}

function luuTkHong(nhap, cau) {
  nhap.dangLuu = false;
  nhap.loiLuu = 'Chưa lưu được: ' + cauNgan(cau) + '.';
  if (NHAP_TK === nhap) {
    veHopTk();
    if (typeof document !== 'undefined') {
      var el = document.getElementById('loi-luu');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }
  }
}

function luuTk() {
  var nhap = NHAP_TK;
  if (!nhap || nhap.dangLuu) return;
  var ham, tham, tenMoi = '';
  var loi = null;
  if (nhap.kieu === 'so-du') {
    var rs = kiemSoDu(TT.duLieu, nhap.ma, nhap.chuSoDu);
    if (rs.soThat === undefined) loi = { soDu: rs.loi };
    else { ham = 'api_suaSoDu'; tham = [nhap.ma, rs.soThat, TT.ky]; }
  } else if (nhap.kieu === 'ten') {
    tenMoi = String(nhap.ten === undefined || nhap.ten === null ? '' : nhap.ten).trim();
    if (tenMoi === '') loi = { ten: CHU_LOI_TEN_TK };
    else { ham = 'api_luuTaiKhoan'; tham = [{ ma: nhap.ma, ten: tenMoi, an: !!nhap.an }, TT.ky]; }
  } else {
    var rk = kiemTaiKhoan(nhap);
    if (!rk.tk) loi = rk.loi;
    else { ham = 'api_luuTaiKhoan'; tham = [rk.tk, TT.ky]; tenMoi = rk.tk.ten; }
  }
  if (loi) {
    nhap.loi = loi;
    nhap.loiLuu = '';
    veHopTk();
    if (typeof document !== 'undefined') {
      var el = document.querySelector('#lop-phu .loi');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }
    return;
  }
  var dauTien = !(TT.duLieu && Array.isArray(TT.duLieu.taiKhoan) && TT.duLieu.taiKhoan.length);
  nhap.loi = {};
  nhap.loiLuu = '';
  nhap.dangLuu = true;
  veHopTk();
  goiMay(ham, tham, function (kq) {
    nhap.dangLuu = false;
    if (!kq || typeof kq !== 'object' || !kq.ky) { luuTkHong(nhap, CHU_MAT_MANG); return; }
    var chu;
    if (nhap.kieu === 'so-du') chu = 'Đã sửa số dư ' + tenTaiKhoan(kq, nhap.ma);
    else if (nhap.kieu === 'ten') chu = 'Đã lưu tài khoản ' + tenMoi;
    else {
      MO_TK = true;
      chu = 'Đã thêm tài khoản ' + tenMoi + (dauTien ? '. Giờ bấm ＋ Ghi khoản để ghi khoản đầu tiên.' : '');
    }
    nhanDuLieuMoi(kq);
    if (NHAP_TK === nhap) dongHopTk();
    baoNhanh(chu);
  }, function (cau) {
    luuTkHong(nhap, cau);
  });
}

function xuLyBamTk(hd, el) {
  if (hd === 'tk-xem-an') { MO_AN = !MO_AN; veLai(); return; }
  if (hd === 'tk-them') { if (!NHAP_TK) { if (NHAP) dongHop(); moHopTaiKhoan(); } return; }
  if (hd === 'tk-so-du') { if (!NHAP && !NHAP_TK) moHopSoDu(el.getAttribute('data-ma') || ''); return; }
  if (hd === 'tk-doi-ten') { if (!NHAP && !NHAP_TK) moHopDoiTen(el.getAttribute('data-ma') || ''); return; }
  var nhap = NHAP_TK;
  if (!nhap) return;
  if (hd === 'tk-dong') dongHopTk();
  else if (hd === 'tk-luu') luuTk();
  else if (hd === 'tk-loai') {
    nhap.loai = el.getAttribute('data-loai') || '';
    if (nhap.loi) delete nhap.loi.loai;
    veHopTk();
  }
}

function xuLyNhapTk(e) {
  var el = e.target;
  if (!NHAP_TK || !el || !el.id) return;
  var loi = NHAP_TK.loi || (NHAP_TK.loi = {});
  if (el.id === 'o-tk-ten') {
    NHAP_TK.ten = el.value;
    if (loi.ten) { delete loi.ten; var l = document.getElementById('loi-tk-ten'); if (l && l.parentNode) l.parentNode.removeChild(l); }
  } else if (el.id === 'o-tk-so') {
    NHAP_TK.chuSoDu = el.value;
    delete loi.soDu;
    capNhatXemTk();
  } else if (el.id === 'o-tk-an') {
    NHAP_TK.an = !!el.checked;
  }
}

/* ---------- Ngân sách · chi theo ngày · cả năm · tìm khoản (vé 07) ---------- */

var NHAP_NS = null;   /* hộp ngân sách đang mở: { chu: {<nhom>: chữ gõ}, loi: {<nhom>: câu}, dangLuu, loiLuu }; null = đóng */
var KY_RE = /^[0-9]{4}-(0[1-9]|1[0-2])$/;
var CHU_KHONG_KHOP = 'Không có khoản nào khớp. Bấm "✕ Bỏ hết lọc" để xem lại tất cả.';
var CHU_SO_AM_NS = 'Gõ số dương, ví dụ 3tr.';
var HD_BC = ['ns-mo', 'ns-luu', 'ns-dong', 'chon-ngay', 'bo-ngay', 'chon-thang', 'loc-tk', 'bo-het-loc'];

function p2(n) { return (n < 10 ? '0' : '') + n; }

/* Số tiền không có chữ ₫: 3000000 → '3.000.000' */
function soKhongDong(so) { return dinhDangTien(so).replace(/ ₫$/, ''); }

function chuanLoc(loc) {
  loc = loc && typeof loc === 'object' ? loc : {};
  var chu = String(loc.chu === undefined || loc.chu === null ? '' : loc.chu).trim();
  var maTk = String(loc.maTk === undefined || loc.maTk === null ? '' : loc.maTk);
  var ngay = /^[0-9]{1,2}$/.test(String(loc.ngay)) && Number(loc.ngay) >= 1 ? String(Number(loc.ngay)) : '';
  return { chu: chu, maTk: maTk, ngay: ngay };
}

function locHienTai() {
  return { chu: TT.locChu || '', maTk: TT.locTk || '', ngay: TT.locNgay || '' };
}

function nhanNgayKy(ky, ngay) {
  var s = String(ky || '');
  return p2(Number(ngay)) + (KY_RE.test(s) ? '/' + s.slice(5, 7) : '');
}

function dungDangLoc(du, locNhom, l, ds) {
  var mo = [];
  if (locNhom) mo.push('nhóm ' + locNhom);
  if (l.ngay) mo.push('ngày ' + nhanNgayKy(du.ky, l.ngay));
  if (l.chu) mo.push('chữ "' + l.chu + '"');
  if (l.maTk) mo.push('tài khoản ' + tenTaiKhoan(du, l.maTk));
  var chi = 0;
  for (var i = 0; i < ds.length; i++) if (ds[i].loai === 'chi') chi += Number(ds[i].soTien) || 0;
  return '<div class="dang-loc"><span>' + thoatHtml('Đang lọc: ' + mo.join(' + ') + ' · ' + ds.length + ' khoản · chi ' + dinhDangTien(chi)) +
    '</span><button class="nut-nho" type="button" data-hd="bo-het-loc">✕ Bỏ hết lọc</button></div>';
}

/* Các dòng của hộp ngân sách: TỔNG rồi từng nhóm chi (bỏ nhóm chỉ toàn mục ẩn, trừ khi nhóm đó đang có ngân sách). */
function dongNganSach(du) {
  du = du || {};
  var hm = Array.isArray(du.hangMuc) ? du.hangMuc : [];
  var ns = Array.isArray(du.nganSach) ? du.nganSach : [];
  var coNs = {};
  for (var i = 0; i < ns.length; i++) if (ns[i] && Number(ns[i].soTien) > 0) coNs[ns[i].nhom] = true;
  var nhom = {};
  var thuTu = [];
  for (var j = 0; j < hm.length; j++) {
    var x = hm[j];
    if (!x || x.kieu !== 'chi' || typeof x.nhom !== 'string' || x.nhom === 'TỔNG') continue;
    var n = nhom[x.nhom];
    if (!n) { n = nhom[x.nhom] = { nhom: x.nhom, bieuTuong: '', hien: false }; thuTu.push(n); }
    if (!n.bieuTuong && x.bieuTuong) n.bieuTuong = String(x.bieuTuong);
    if (!x.an) n.hien = true;
  }
  var kq = [{ nhom: 'TỔNG', bieuTuong: '' }];
  for (var k = 0; k < thuTu.length; k++) {
    if (thuTu[k].hien || coNs[thuTu[k].nhom]) kq.push({ nhom: thuTu[k].nhom, bieuTuong: thuTu[k].bieuTuong });
  }
  return kq;
}

function tenDongNs(d) {
  return d.nhom === 'TỔNG' ? 'Tổng chi tiêu' : (d.bieuTuong ? d.bieuTuong + ' ' : '') + d.nhom;
}

function nhapNsMoi(du) {
  du = du || {};
  var ns = Array.isArray(du.nganSach) ? du.nganSach : [];
  var so = {};
  for (var i = 0; i < ns.length; i++) if (ns[i] && Number(ns[i].soTien) > 0) so[ns[i].nhom] = Number(ns[i].soTien);
  var dong = dongNganSach(du);
  var chu = {};
  for (var j = 0; j < dong.length; j++) chu[dong[j].nhom] = so[dong[j].nhom] ? soKhongDong(so[dong[j].nhom]) : '';
  return { chu: chu, loi: {}, dangLuu: false, loiLuu: '' };
}

function docSoNs(chu) {
  var r = docSoTienKhong(chu, true);
  if (r.loi && /^Gõ số dương/.test(r.loi)) return { loi: CHU_SO_AM_NS };
  return r;
}

function kiemNganSach(du, nhapNs) {
  var chu = nhapNs && nhapNs.chu && typeof nhapNs.chu === 'object' ? nhapNs.chu : {};
  var dong = dongNganSach(du);
  var loi = {};
  var ds = [];
  var coLoi = false;
  for (var i = 0; i < dong.length; i++) {
    var r = docSoNs(chu[dong[i].nhom]);
    if (r.loi) { loi[dong[i].nhom] = r.loi; coLoi = true; }
    else ds.push({ nhom: dong[i].nhom, soTien: r.so });
  }
  return coLoi ? { loi: loi } : { loi: loi, ds: ds };
}

function dungNganSach(du) {
  du = du || {};
  var goc = Array.isArray(du.nganSach) ? du.nganSach : [];
  var ns = [];
  for (var i = 0; i < goc.length; i++) if (goc[i] && Number(goc[i].soTien) > 0) ns.push(goc[i]);
  if (!ns.length) {
    return '<div class="khung ns-moi"><p>🎯 Đặt ngân sách tháng để biết lúc nào sắp tiêu quá tay.</p>' +
      '<button class="nut-nho" type="button" data-hd="ns-mo">Đặt ngân sách</button></div>';
  }
  var bieuTuong = {};
  var dong = dongNganSach(du);
  for (var b = 0; b < dong.length; b++) bieuTuong[dong[b].nhom] = dong[b].bieuTuong;
  var ds = tienDoNganSach(ns, du.khoan, du.hangMuc);
  var h = '<div class="the"><div class="tieu-ds"><h2>' + thoatHtml('🎯 Ngân sách' + (KY_RE.test(String(du.ky)) ? ' · ' + tenKy(du.ky) : '')) + '</h2>' +
    '<button class="nut-nho" type="button" data-hd="ns-mo">✏️ Sửa</button></div><ul class="ds-ns">';
  for (var j = 0; j < ds.length; j++) {
    var d = ds[j];
    var rong = d.nganSach > 0 ? Math.min(100, d.daChi * 100 / d.nganSach) : 100;
    rong = Math.max(0, Math.round(rong * 10) / 10);
    var con = dinhDangTien(Math.abs(d.conLai));
    var tt = d.muc === 'vuot' ? '🔴 Vượt ' + con : d.muc === 'sap_het' ? '⚠️ Sắp hết · còn ' + con : 'Còn ' + con;
    h += '<li class="ns-dong ' + (d.muc === 'vuot' ? 'vuot' : d.muc === 'sap_het' ? 'sap-het' : 'thuong') + '">' +
      '<div class="ns-d1"><span class="ns-ten">' + thoatHtml(tenDongNs({ nhom: d.nhom, bieuTuong: bieuTuong[d.nhom] || '' })) + '</span>' +
      '<span class="ns-so">Đã chi ' + soKhongDong(d.daChi) + ' / ' + dinhDangTien(d.nganSach) + '</span></div>' +
      '<div class="ns-thanh" aria-hidden="true"><span style="width:' + rong + '%"></span></div>' +
      '<div class="ns-tt">' + thoatHtml(tt) + '</div></li>';
  }
  return h + '</ul></div>';
}

function dungHopNganSach(du, nhapNs) {
  var nhap = nhapNs && typeof nhapNs === 'object' ? nhapNs : {};
  var chu = nhap.chu && typeof nhap.chu === 'object' ? nhap.chu : {};
  var loi = nhap.loi && typeof nhap.loi === 'object' ? nhap.loi : {};
  var dong = dongNganSach(du);
  var h = '<div class="hop" role="dialog" aria-modal="true" aria-label="Ngân sách mỗi tháng">' +
    '<div class="hop-dau"><h2>🎯 Ngân sách mỗi tháng</h2><button class="nut" type="button" data-hd="ns-dong">✕ Đóng</button></div>' +
    '<p class="goi-y">👉 Gõ số tiền tối đa muốn tiêu mỗi tháng cho từng nhóm. Để trống = không đặt.</p>';
  for (var i = 0; i < dong.length; i++) {
    var n = dong[i].nhom;
    var gt = chu[n] === undefined || chu[n] === null ? '' : chu[n];
    h += '<div class="nhom-nhap ns-o"><div class="ns-hang"><label class="ns-nhan" for="o-ns-' + i + '">' + thoatHtml(tenDongNs(dong[i])) + '</label>' +
      '<input id="o-ns-' + i + '" class="o o-ns" type="text" inputmode="decimal" autocomplete="off" placeholder="Không đặt" data-nhom="' + thoatHtml(n) +
      '" data-i="' + i + '" value="' + thoatHtml(gt) + '"></div>' +
      '<div id="loi-ns-' + i + '">' + (loi[n] ? '<p class="loi" role="alert">' + thoatHtml(loi[n]) + '</p>' : '') + '</div></div>';
  }
  h += '<div class="chan-hop">';
  if (nhap.loiLuu) h += '<div class="khung do" id="loi-luu" role="alert">' + thoatHtml(nhap.loiLuu) + '</div>';
  h += '<button class="nut-chinh" type="button" data-hd="ns-luu"' + (nhap.dangLuu ? ' disabled' : '') + '>' + (nhap.dangLuu ? '⏳ Đang lưu…' : '💾 Lưu ngân sách') + '</button>';
  return h + '<button class="nut" type="button" data-hd="ns-dong">Thôi</button></div></div>';
}

function dungTheoNgay(du, ngayChon) {
  du = du || {};
  var ky = String(du.ky || '');
  var hop = KY_RE.test(ky);
  var tieu = '<h2>' + thoatHtml('📅 Chi theo ngày' + (hop ? ' · ' + tenKy(ky) : '')) + '</h2>';
  var ds = hop ? chiTheoNgay(du.khoan, ky) : [];
  var lon = 0, ngayLon = 0;
  for (var i = 0; i < ds.length; i++) if (ds[i].soTien > lon) { lon = ds[i].soTien; ngayLon = ds[i].ngay; }
  if (!(lon > 0)) return '<div class="the">' + tieu + '<p class="rong">Tháng này chưa có khoản chi nào.</p></div>';
  var homNay = String(du.homNay || '');
  var ngayHomNay = homNay.slice(0, 7) === ky ? parseInt(homNay.slice(8, 10), 10) || 0 : 0;
  var chon = chuanLoc({ ngay: ngayChon }).ngay;
  var soChon = chon && Number(chon) <= ds.length ? Number(chon) : 0;
  var cuoi = ds.length;
  var tomTat = 'Biểu đồ chi theo ngày ' + tenKy(ky) + '. Chi nhiều nhất ngày ' + nhanNgayKy(ky, ngayLon) + ': ' + dinhDangTien(lon) + '.' +
    (ngayHomNay && ngayHomNay <= cuoi ? ' Hôm nay ' + nhanNgayKy(ky, ngayHomNay) + ': ' + dinhDangTien(ds[ngayHomNay - 1].soTien) + '.' : '');
  var h = '<div class="the">' + tieu +
    '<p class="cao-nhat" role="img" aria-label="' + thoatHtml(tomTat) + '">Cao nhất: ' + thoatHtml(dinhDangTien(lon)) + ' · ngày ' + thoatHtml(nhanNgayKy(ky, ngayLon)) + '</p>' +
    '<div class="cot-hang" style="grid-template-columns:repeat(' + cuoi + ',minmax(0,1fr))">';
  for (var j = 0; j < ds.length; j++) {
    var d = ds[j].ngay;
    var cao = Math.round(ds[j].soTien * 1000 / lon) / 10;
    var nhan = (d === 1 || d === 5 || d === 10 || d === 15 || d === 20 || d === 25 || d === cuoi) ? String(d) : '';
    var laChon = d === soChon;
    h += '<button class="cot' + (laChon ? ' chon' : '') + (d === ngayHomNay ? ' hom-nay' : '') + '" type="button" data-hd="chon-ngay" data-ngay="' + d +
      '" aria-pressed="' + (laChon ? 'true' : 'false') + '" aria-label="' + thoatHtml('Ngày ' + nhanNgayKy(ky, d) + ': ' + dinhDangTien(ds[j].soTien)) + '">' +
      '<span class="cot-khung"><span class="cot-than' + (ds[j].soTien > 0 ? '' : ' khong') + '" style="height:' + cao + '%"></span></span>' +
      '<span class="cot-nhan">' + nhan + '</span></button>';
  }
  h += '</div>';
  if (soChon) {
    var n = 0;
    var goc = Array.isArray(du.khoan) ? du.khoan : [];
    for (var k = 0; k < goc.length; k++) {
      var x = goc[k];
      if (x && x.loai === 'chi' && String(x.ngayGio).slice(0, 7) === ky && parseInt(String(x.ngayGio).slice(8, 10), 10) === soChon) n++;
    }
    h += '<div class="ngay-chon"><p><strong>' + thoatHtml('Ngày ' + nhanNgayKy(ky, soChon) + ': ' + dinhDangTien(ds[soChon - 1].soTien) + ' · ' + n + ' khoản') + '</strong>' +
      (soChon === ngayHomNay ? ' · Hôm nay' : '') + '</p>' +
      '<button class="nut-nho" type="button" data-hd="bo-ngay">✕ Bỏ chọn ngày</button></div>';
  }
  return h + '</div>';
}

function dungCaNam(du) {
  du = du || {};
  var ky = String(du.ky || '');
  var goc = Array.isArray(du.nam) ? du.nam : [];
  var nam = KY_RE.test(ky) ? ky.slice(0, 4) : '';
  if (!nam) for (var a = 0; a < goc.length && !nam; a++) if (goc[a] && /^[0-9]{4}-/.test(String(goc[a].thang))) nam = String(goc[a].thang).slice(0, 4);
  var theoThang = {};
  for (var i = 0; i < goc.length; i++) {
    var m = goc[i];
    if (!m || typeof m !== 'object') continue;
    theoThang[String(m.thang)] = { thu: Math.max(0, Number(m.thu) || 0), chi: Math.max(0, Number(m.chi) || 0) };
  }
  var thang = [];
  var tongThu = 0, tongChi = 0, lon = 0;
  for (var t = 1; t <= 12; t++) {
    var k = nam + '-' + p2(t);
    var v = theoThang[k] || { thu: 0, chi: 0 };
    thang.push({ t: t, ky: k, thu: v.thu, chi: v.chi });
    tongThu += v.thu; tongChi += v.chi;
    lon = Math.max(lon, v.thu, v.chi);
  }
  var h = '<div class="the"><h2>' + thoatHtml('📊 Cả năm' + (nam ? ' ' + nam : '')) + '</h2>';
  if (!nam || !(lon > 0)) return h + '<p class="rong">' + thoatHtml('Năm ' + nam + ' chưa có khoản thu chi nào.') + '</p></div>';
  h += '<div class="nam-hang">';
  for (var j = 0; j < thang.length; j++) {
    var x = thang[j];
    var laXem = x.ky === ky;
    h += '<button class="thang-cot' + (laXem ? ' chon' : '') + '" type="button" data-hd="chon-thang" data-ky="' + x.ky + '" aria-pressed="' + (laXem ? 'true' : 'false') +
      '" aria-label="' + thoatHtml(tenKy(x.ky) + ': thu ' + dinhDangTien(x.thu) + ', chi ' + dinhDangTien(x.chi) + (laXem ? ' (đang xem)' : '')) + '">' +
      '<span class="cap-cot"><span class="cot-thu" style="height:' + (Math.round(x.thu * 1000 / lon) / 10) + '%"></span>' +
      '<span class="cot-chi" style="height:' + (Math.round(x.chi * 1000 / lon) / 10) + '%"></span></span>' +
      '<span class="cot-nhan2">T' + x.t + '</span></button>';
  }
  h += '</div><p class="chu-thich-nam"><span class="o-thu">■</span> Thu <span class="o-chi">■</span> Chi · chạm một tháng để mở tháng đó</p>';
  return h + '<p class="tong-nam">' + thoatHtml('Thu cả năm: ' + dinhDangTien(tongThu) + ' · Chi cả năm: ' + dinhDangTien(tongChi) + ' · Còn: ' + dinhDangTien(tongThu - tongChi)) + '</p></div>';
}

/* Tài khoản có nút lọc: các tài khoản đang dùng, cộng tài khoản đã ẩn nếu tháng này có khoản của nó hoặc đang được chọn. */
function dsTkLoc(du) {
  var tk = Array.isArray(du.taiKhoan) ? du.taiKhoan : [];
  var khoan = Array.isArray(du.khoan) ? du.khoan : [];
  var dung = {};
  for (var i = 0; i < khoan.length; i++) if (khoan[i]) { dung[khoan[i].taiKhoan] = true; dung[khoan[i].taiKhoanDen] = true; }
  var kq = [];
  for (var j = 0; j < tk.length; j++) {
    var x = tk[j];
    if (!x || x.ma === undefined || x.ma === null || x.ma === '') continue;
    if (!x.an || dung[x.ma] || x.ma === TT.locTk) kq.push(x);
  }
  return kq;
}

function nutLocTk(ma, ten, chon) {
  return '<button class="chon-tk' + (chon ? ' chon' : '') + '" type="button" data-hd="loc-tk" data-ma="' + thoatHtml(ma) + '" aria-pressed="' + (chon ? 'true' : 'false') + '">' +
    thoatHtml((chon ? '✓ ' : '') + ten) + '</button>';
}

function dungO_Tim(du) {
  du = du && typeof du === 'object' ? du : {};
  var dang = TT.locTk || '';
  var tk = dsTkLoc(du);
  var h = '<div class="the tim-the"><h2>🔎 Tìm khoản</h2>' +
    '<input id="o-tim-khoan" class="o" type="search" autocomplete="off" enterkeyhint="search" aria-label="Tìm khoản trong tháng" placeholder="Tìm: ghi chú, hạng mục… (gõ không dấu được)" value="' +
    thoatHtml(TT.locChu || '') + '">' +
    '<div class="hang-tk loc-tk" role="group" aria-label="Lọc theo tài khoản">' + nutLocTk('', 'Tất cả', !dang);
  for (var i = 0; i < tk.length; i++) h += nutLocTk(String(tk[i].ma), String(tk[i].ten === undefined || tk[i].ten === null ? '' : tk[i].ten), String(tk[i].ma) === dang);
  return h + '</div></div>';
}

/* ---- chạm document ---- */

function veVungDanhSach(du) {
  var dangGo = document.activeElement && document.activeElement.id === 'o-tim-khoan' ? document.activeElement : null;
  var dau = dangGo ? dangGo.selectionStart : null;
  var cuoi = dangGo ? dangGo.selectionEnd : null;
  gan('danh-sach', dungO_Tim(du) + '<div id="ds-khoan">' + dungDanhSach(du, TT.locNhom, locHienTai()) + '</div>');
  if (dangGo) {
    var moi = document.getElementById('o-tim-khoan');
    if (moi && moi !== dangGo && moi.focus) {
      moi.focus();
      try { if (dau !== null) moi.setSelectionRange(dau, cuoi); } catch (e) { /* type=search có máy không cho đặt chỗ con trỏ */ }
    }
  }
}

function veDsKhoan() {
  if (typeof document === 'undefined') return;
  gan('ds-khoan', dungDanhSach(TT.duLieu, TT.locNhom, locHienTai()));
}

function xuLyNhapLoc(e) {
  var el = e && e.target;
  if (!el || el.id !== 'o-tim-khoan') return;
  TT.locChu = String(el.value === undefined || el.value === null ? '' : el.value);
  veDsKhoan();
}

function veHopNs() {
  if (typeof document === 'undefined' || !NHAP_NS) return;
  var lop = document.getElementById('lop-phu');
  if (!lop) return;
  var cu = lop.querySelector('.hop');
  var cuon = cu ? cu.scrollTop : 0;
  lop.innerHTML = dungHopNganSach(TT.duLieu, NHAP_NS);
  var moi = lop.querySelector('.hop');
  if (moi) moi.scrollTop = cuon;
}

function veLoiNs(el) {
  if (typeof document === 'undefined' || !NHAP_NS || !el) return;
  var nhom = el.getAttribute('data-nhom');
  var o = document.getElementById('loi-ns-' + el.getAttribute('data-i'));
  if (o) o.innerHTML = NHAP_NS.loi[nhom] ? '<p class="loi" role="alert">' + thoatHtml(NHAP_NS.loi[nhom]) + '</p>' : '';
}

function moHopNganSach() {
  var du = TT.duLieu;
  if (!du || NHAP_NS || NHAP || NHAP_TK) return;
  NHAP_NS = nhapNsMoi(du);
  moHop(dungHopNganSach(du, NHAP_NS));
}

function dongHopNs() {
  NHAP_NS = null;
  dongHop();
}

function luuNsHong(nhap, cau) {
  nhap.dangLuu = false;
  nhap.loiLuu = 'Chưa lưu được: ' + cauNgan(cau) + '.';
  if (NHAP_NS === nhap) {
    veHopNs();
    if (typeof document !== 'undefined') {
      var el = document.getElementById('loi-luu');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }
  }
}

function luuNganSach() {
  var nhap = NHAP_NS;
  if (!nhap || nhap.dangLuu) return;
  var r = kiemNganSach(TT.duLieu, nhap);
  if (!r.ds) {
    nhap.loi = r.loi;
    nhap.loiLuu = '';
    veHopNs();
    if (typeof document !== 'undefined') {
      var el = document.querySelector('#lop-phu .loi');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }
    return;
  }
  nhap.loi = {};
  nhap.loiLuu = '';
  nhap.dangLuu = true;
  veHopNs();
  goiMay('api_luuNganSach', [r.ds, TT.ky], function (kq) {
    nhap.dangLuu = false;
    if (!kq || typeof kq !== 'object' || !kq.ky) { luuNsHong(nhap, CHU_MAT_MANG); return; }
    nhanDuLieuMoi(kq);
    if (NHAP_NS === nhap) dongHopNs();
    baoNhanh('Đã lưu ngân sách.');
  }, function (cau) {
    luuNsHong(nhap, cau);
  });
}

function xuLyBamBc(hd, el) {
  if (hd === 'ns-mo') moHopNganSach();
  else if (hd === 'ns-luu') luuNganSach();
  else if (hd === 'ns-dong') { if (NHAP_NS) dongHopNs(); }
  else if (hd === 'chon-ngay') {
    var ngay = chuanLoc({ ngay: el.getAttribute('data-ngay') }).ngay;
    TT.locNgay = TT.locNgay === ngay ? '' : ngay;
    veLai();
  } else if (hd === 'bo-ngay') {
    TT.locNgay = '';
    veLai();
  } else if (hd === 'loc-tk') {
    var ma = el.getAttribute('data-ma') || '';
    TT.locTk = (ma && TT.locTk === ma) ? '' : ma;
    veLai();
  } else if (hd === 'bo-het-loc') {
    TT.locNhom = ''; TT.locChu = ''; TT.locTk = ''; TT.locNgay = '';
    var o = typeof document !== 'undefined' && document.getElementById ? document.getElementById('o-tim-khoan') : null;
    if (o) o.value = '';
    veLai();
  } else if (hd === 'chon-thang') {
    var ky = el.getAttribute('data-ky') || '';
    if (TT.dangTai || !KY_RE.test(ky)) return;
    taiThang(ky);
    if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  }
}

function xuLyNhapNs(e) {
  var el = e && e.target;
  if (!NHAP_NS || !el || !el.getAttribute) return;
  var nhom = el.getAttribute('data-nhom');
  if (nhom === null || !/\bo-ns\b/.test(el.className || '')) return;
  NHAP_NS.chu[nhom] = el.value;
  if (NHAP_NS.loi[nhom]) { delete NHAP_NS.loi[nhom]; veLoiNs(el); }
}

function xuLyRoiNs(e) {
  var el = e && e.target;
  if (!NHAP_NS || !el || !el.getAttribute) return;
  var nhom = el.getAttribute('data-nhom');
  if (nhom === null || !/\bo-ns\b/.test(el.className || '')) return;
  var r = docSoNs(el.value);
  if (r.loi) NHAP_NS.loi[nhom] = r.loi; else delete NHAP_NS.loi[nhom];
  veLoiNs(el);
}

/* ---------- Mốc 3: phải trả · trả kỳ · lịch trả của tài khoản nợ ---------- */

var NHAP_TRA = null;  /* hộp trả một khoản: { ma, kieu, tenTk, noiDung, ky, han, phaiTra, goc, chuSoTien, tuTk, ngay, dangLuu, loiLuu, loi } */
var NHAP_LICH = null; /* hộp lịch trả của một tài khoản nợ: { maTk, chuHan, chuSoTien, chuSoKy, noiDung, chuNgayThe, dangLuu, loiLuu, loi } */
var HD_NO = ['tra-mo', 'tra-tk', 'tra-luu', 'tra-dong', 'lich-mo', 'lich-dong', 'lich-them', 'lich-xoa', 'lich-han', 'chia-bat'];

function chuNgayDayDu(han) {
  var s = String(han || '');
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : s;
}

function chuTrangThaiTra(m, homNay) {
  if (m.daTra) return m.kieu === 'the' ? '✅ Đã trả hết' : '✅ Đã trả';
  var n = soNgayGiua(homNay, m.han);
  if (n < 0) return '⚠️ Quá hạn ' + (-n) + ' ngày';
  if (n === 0) return '⏳ Hạn hôm nay';
  return '⏳ Còn ' + n + ' ngày';
}

function tenKhoanTra(m) {
  return String(m.noiDung || '') + (m.ky ? ' · kỳ ' + m.ky : '');
}

function dungDongTra(du, m) {
  var homNay = String(du.homNay || '');
  var trai = '<span class="trai"><span class="cho-ngay">' + thoatHtml(chuNgayDayDu(m.han).slice(0, 5) + ' · ' + m.tenTk) + '</span>' +
    '<span class="cho-ghi">' + thoatHtml(catChu(tenKhoanTra(m), 60)) + '</span>' +
    '<span class="nhan-tra ' + m.trangThai + '">' + thoatHtml(chuTrangThaiTra(m, homNay)) + '</span></span>';
  var so = '<span class="cho-so">' + (m.uocTinh && !m.daTra ? '≈ ' : '') + thoatHtml(dinhDangTien(m.soTien)) + '</span>';
  if (m.daTra) return '<div class="dong-cho dong-tra da_tra">' + trai + so + '</div>';
  return '<button class="dong-cho dong-tra ' + m.trangThai + '" type="button" data-hd="tra-mo" data-ma="' + thoatHtml(m.ma) + '">' + trai + so + '</button>';
}

function dungPhaiTra(du) {
  if (!du || typeof du !== 'object' || !du.ky) return '';
  var p = phaiTraThang(du, du.ky);
  var sau = phaiTraThangSau(du, du.ky, 3).filter(function (x) { return x.tong > 0; });
  var no = noTheoTk(du);
  if (!p.muc.length && !sau.length && !no.length) return '';
  var h = '<div class="the phai-tra"><h2>' + thoatHtml('📅 Phải trả ' + tenKy(du.ky).toLowerCase() + ': ' + dinhDangTien(p.tong)) + '</h2>';
  if (p.muc.length) {
    h += '<p class="goi-y">Đã trả ' + dinhDangTien(p.daTra) + ' · Còn ' + dinhDangTien(p.conLai) + '. Trả xong thì chạm dòng đó để ghi.</p>';
    for (var i = 0; i < p.muc.length; i++) h += dungDongTra(du, p.muc[i]);
  } else {
    h += '<p class="goi-y">Tháng này không có khoản nào đến hạn.</p>';
  }
  if (sau.length) {
    h += '<p class="tra-sau-nua">🗓️ Các tháng sau: ' + sau.map(function (x) {
      return thoatHtml(x.ky.slice(5, 7) + '/' + x.ky.slice(0, 4)) + ' <strong>' + dinhDangTien(x.tong) + '</strong>';
    }).join(' · ') + '</p>';
  }
  if (no.length) {
    h += '<p class="no-con">💳 Nợ còn lại: ' + no.map(function (x) {
      return thoatHtml(x.ten) + ' <strong>' + dinhDangTien(x.no) + '</strong>' +
        (x.hetVao ? ' (hết ' + thoatHtml(x.hetVao.slice(5, 7) + '/' + x.hetVao.slice(0, 4)) + ')' : '');
    }).join(' · ') + '</p>';
  }
  return h + '</div>';
}

/* ---- hộp trả một khoản ---- */

function tkTraDuoc(du) {
  var ds = du && Array.isArray(du.taiKhoan) ? du.taiKhoan : [];
  return ds.filter(function (t) { return t && !t.an && (t.loai === 'ngan_hang' || t.loai === 'tien_mat'); });
}

function timMucTra(du, ma) {
  if (!du || !du.ky) return null;
  var ds = phaiTraThang(du, du.ky).muc;
  for (var i = 0; i < ds.length; i++) if (ds[i].ma === ma) return ds[i];
  return null;
}

function nhapTra(du, m) {
  var tk = tkTraDuoc(du);
  return {
    ma: m.ma, kieu: m.kieu, tenTk: m.tenTk, noiDung: m.noiDung, ky: m.ky, han: m.han, phaiTra: m.soTien, goc: m.goc,
    chuSoTien: m.soTien > 0 ? String(m.soTien) : '', tuTk: tk.length ? tk[0].ma : '', ngay: String(du.homNay || ''),
    dangLuu: false, loiLuu: '', loi: {}
  };
}

function kiemTra(du, nhap) {
  var loi = {};
  var tien = docSoTien(nhap.chuSoTien);
  if (tien.loi) loi.soTien = tien.loi;
  if (!nhap.tuTk) loi.tuTk = 'Chọn trả bằng tài khoản nào.';
  if (!ngayHopLe(nhap.ngay)) loi.ngay = 'Chọn lại ngày trả.';
  for (var khoa in loi) {
    if (Object.prototype.hasOwnProperty.call(loi, khoa)) return { loi: loi };
  }
  var gio = String(du && du.bayGio || '').slice(11, 16);
  return { loi: loi, t: { tuTaiKhoan: nhap.tuTk, soTien: tien.so, ngayGio: nhap.ngay + ' ' + (gioHopLe(gio) ? gio : '12:00') } };
}

function loiNo(nhap, khoa) {
  var l = nhap.loi && nhap.loi[khoa];
  return l ? '<p class="loi" id="loi-no-' + khoa + '" role="alert">' + thoatHtml(l) + '</p>' : '';
}

function phanXemTra(nhap) {
  if (nhap.loi && nhap.loi.soTien) return loiNo(nhap, 'soTien');
  var r = docSoTien(nhap.chuSoTien);
  if (!r.so) return '';
  var h = '= ' + dinhDangTien(r.so);
  if (nhap.kieu === 'ky' && nhap.goc > 0 && r.so > nhap.goc) h += '<div class="chenh-so">Phần hơn gốc ' + dinhDangTien(r.so - nhap.goc) + ' tính là chi "Phí & lãi".</div>';
  return h;
}

function dungChanNo(nhap, nhanLuu, hd, hdDong) {
  var h = '<div class="chan-hop">';
  if (nhap.loiLuu) h += '<div class="khung do" id="loi-luu" role="alert">' + thoatHtml(nhap.loiLuu) + '</div>';
  h += '<button class="nut-chinh" type="button" data-hd="' + hd + '"' + (nhap.dangLuu ? ' disabled' : '') + '>' + (nhap.dangLuu ? '⏳ Đang lưu…' : nhanLuu) + '</button>';
  return h + '<button class="nut" type="button" data-hd="' + hdDong + '">Thôi</button></div>';
}

function dungHopTra(du, nhap) {
  var tk = tkTraDuoc(du);
  var h = '<div class="hop" role="dialog" aria-modal="true" aria-label="Ghi đã trả">' +
    '<div class="hop-dau"><h2>💸 Ghi đã trả</h2><button class="nut" type="button" data-hd="tra-dong">✕ Đóng</button></div>' +
    '<dl class="thu-tt"><dt>Trả cho</dt><dd>' + thoatHtml(nhap.tenTk) + '</dd><dt>Khoản</dt><dd>' + thoatHtml(tenKhoanTra(nhap) || '—') + '</dd>' +
    '<dt>Hạn</dt><dd>' + thoatHtml(chuNgayDayDu(nhap.han)) + '</dd><dt>Phải trả</dt><dd>' + (nhap.kieu === 'the' ? '≈ ' : '') + thoatHtml(dinhDangTien(nhap.phaiTra)) + '</dd></dl>' +
    '<p class="goi-y">👉 Đây là chuyển tiền trả nợ, không tính thêm vào chi tiêu (món hàng đã tính lúc mua).</p>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-tra-tien">Số tiền đã trả</label>' +
    '<input id="o-tra-tien" class="o o-tien" type="text" inputmode="decimal" autocomplete="off" placeholder="Ví dụ 2tr" value="' + thoatHtml(nhap.chuSoTien) + '">' +
    '<div id="xem-tra-tien" class="xem-tien" aria-live="polite">' + phanXemTra(nhap) + '</div></div>' +
    '<div class="nhom-nhap"><h3 class="nhan-hang">Trả bằng</h3><div class="hang-tk">';
  for (var i = 0; i < tk.length; i++) {
    var chon = tk[i].ma === nhap.tuTk;
    h += '<button class="chon-tk' + (chon ? ' chon' : '') + '" type="button" data-hd="tra-tk" data-ma="' + thoatHtml(tk[i].ma) +
      '" aria-pressed="' + (chon ? 'true' : 'false') + '">' + (chon ? '✓ ' : '') + thoatHtml(tk[i].ten) + '</button>';
  }
  if (!tk.length) h += '<p class="goi-y">Chưa có tài khoản ngân hàng hay tiền mặt nào.</p>';
  h += '</div>' + loiNo(nhap, 'tuTk') + '</div>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-tra-ngay">Ngày trả</label>' +
    '<input id="o-tra-ngay" class="o" type="date" value="' + thoatHtml(nhap.ngay) + '">' + loiNo(nhap, 'ngay') + '</div>';
  return h + dungChanNo(nhap, '💾 Lưu đã trả', 'tra-luu', 'tra-dong') + '</div>';
}

/* ---- hộp lịch trả của một tài khoản nợ ---- */

function nhapLich(du, maTk) {
  var the = hanThe(du)[maTk];
  return { maTk: maTk, chuHan: '', chuSoTien: '', chuSoKy: '1', noiDung: '', congVaoNo: true, chuNgayThe: the ? String(the.han) : '', dangLuu: false, loiLuu: '', loi: {} };
}

function soNguyenChu(chu, tu, den) {
  var s = String(chu === undefined || chu === null ? '' : chu).trim();
  if (!/^\d{1,3}$/.test(s)) return null;
  var n = Number(s);
  return n >= tu && n <= den ? n : null;
}

function kiemThemKy(nhap) {
  var loi = {};
  if (!ngayHopLe(nhap.chuHan)) loi.han = 'Chọn ngày đến hạn (kỳ đầu).';
  var tien = docSoTien(nhap.chuSoTien);
  if (tien.loi) loi.soTien = tien.loi;
  var soKy = soNguyenChu(nhap.chuSoKy, 1, 60);
  if (soKy === null) loi.soKy = 'Số kỳ từ 1 đến 60.';
  for (var khoa in loi) {
    if (Object.prototype.hasOwnProperty.call(loi, khoa)) return { loi: loi };
  }
  return { loi: loi, ky: { han: nhap.chuHan, soTien: tien.so, soKy: soKy, noiDung: String(nhap.noiDung || '').trim(), congVaoNo: nhap.congVaoNo !== false } };
}

function dungHopLich(du, nhap) {
  var tk = timTk(du, nhap.maTk);
  if (!tk) {
    return '<div class="hop nho" role="dialog" aria-modal="true"><p class="goi-y">' + thoatHtml(CHU_LOI_KHONG_THAY) + '</p>' +
      '<div class="chan-hop"><button class="nut" type="button" data-hd="lich-dong">Đóng</button></div></div>';
  }
  var ds = lichConLaiCua(du, tk.ma);
  var tong = 0;
  ds.forEach(function (l) { tong += Number(l.soTien) || 0; });
  var khoa = nhap.dangLuu ? ' disabled' : '';
  var h = '<div class="hop" role="dialog" aria-modal="true" aria-label="Lịch trả">' +
    '<div class="hop-dau"><h2>' + thoatHtml('📅 Lịch trả · ' + tk.ten) + '</h2><button class="nut" type="button" data-hd="lich-dong">✕ Đóng</button></div>' +
    '<p class="so-trong-so">Đang nợ: ' + dinhDangTien(Math.max(0, -(Number(tk.soDu) || 0))) + (ds.length ? ' · còn ' + ds.length + ' kỳ, tổng ' + dinhDangTien(tong) : '') + '</p>';
  if (ds.length) {
    h += '<ul class="ds-lich">';
    for (var i = 0; i < ds.length; i++) {
      var l = ds[i];
      h += '<li><span class="trai"><span class="cho-ngay">' + thoatHtml(chuNgayDayDu(l.han)) + '</span><span class="cho-ghi">' + thoatHtml(catChu(tenKhoanTra(l), 60)) + '</span></span>' +
        '<span class="cho-so">' + thoatHtml(dinhDangTien(l.soTien)) + '</span>' +
        '<button class="nut-nho" type="button" data-hd="lich-xoa" data-ma="' + thoatHtml(l.ma) + '" aria-label="Xoá kỳ ' + thoatHtml(chuNgayDayDu(l.han)) + '"' + khoa + '>🗑 Xoá</button></li>';
    }
    h += '</ul>';
  } else {
    h += '<p class="goi-y">Chưa có kỳ nào phải trả.</p>';
  }
  h += '<h3 class="nhan-hang">＋ Thêm khoản phải trả (nợ cũ)</h3>' +
    '<p class="goi-y">👉 ' + (tk.loai === 'tra_sau' ? 'Mở app Shopee → SPayLater xem từng kỳ còn nợ. ' : '') +
    'Các kỳ bằng nhau thì gõ số kỳ, em tự lặp hằng tháng. Nợ cũ không tính vào chi tiêu tháng này.</p>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-lich-han">Hạn kỳ đầu</label>' +
    '<input id="o-lich-han" class="o" type="date" value="' + thoatHtml(nhap.chuHan) + '">' + loiNo(nhap, 'han') + '</div>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-lich-tien">Số tiền mỗi kỳ</label>' +
    '<input id="o-lich-tien" class="o" type="text" inputmode="decimal" autocomplete="off" placeholder="Ví dụ 1tr2" value="' + thoatHtml(nhap.chuSoTien) + '">' +
    '<div id="xem-lich-tien" class="xem-tien" aria-live="polite">' + phanXemLich(nhap) + '</div></div>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-lich-soky">Số kỳ</label>' +
    '<input id="o-lich-soky" class="o" type="text" inputmode="numeric" autocomplete="off" value="' + thoatHtml(nhap.chuSoKy) + '">' + loiNo(nhap, 'soKy') + '</div>' +
    '<div class="nhom-nhap"><label class="nhan-hang" for="o-lich-nd">Nội dung (không bắt buộc)</label>' +
    '<input id="o-lich-nd" class="o" type="text" autocomplete="off" placeholder="Ví dụ: nợ cũ tháng 10" value="' + thoatHtml(nhap.noiDung) + '"></div>' +
    '<div class="nhom-nhap"><label class="dong-an"><input type="checkbox" id="o-lich-cong"' + (nhap.congVaoNo !== false ? ' checked' : '') + '><span>' +
    'Cộng vào số đang nợ (bỏ chọn nếu lúc tạo tài khoản anh đã gõ nợ đầu gồm khoản này)</span></label></div>' +
    '<button class="nut-chinh" type="button" data-hd="lich-them"' + khoa + '>' + (nhap.dangLuu ? '⏳ Đang lưu…' : '＋ Thêm vào lịch') + '</button>';
  if (tk.loai === 'the_tin_dung') {
    h += '<h3 class="nhan-hang">Ngày phải trả thẻ hằng tháng</h3>' +
      '<p class="goi-y">👉 Xem trên sao kê thẻ ("hạn thanh toán"). Gõ 0 để bỏ.</p>' +
      '<div class="dong-tien"><input id="o-lich-ngay-the" class="o" type="text" inputmode="numeric" autocomplete="off" aria-label="Ngày hạn trong tháng" placeholder="Ví dụ 15" value="' +
      thoatHtml(nhap.chuNgayThe) + '"><button class="nut" type="button" data-hd="lich-han"' + khoa + '>💾 Lưu ngày</button></div>' + loiNo(nhap, 'ngayThe');
  }
  h += '<div class="chan-hop">';
  if (nhap.loiLuu) h += '<div class="khung do" id="loi-luu" role="alert">' + thoatHtml(nhap.loiLuu) + '</div>';
  return h + '<button class="nut" type="button" data-hd="lich-dong">Xong</button></div></div>';
}

function phanXemLich(nhap) {
  if (nhap.loi && nhap.loi.soTien) return loiNo(nhap, 'soTien');
  var r = docSoTien(nhap.chuSoTien);
  if (!r.so) return '';
  var n = soNguyenChu(nhap.chuSoKy, 1, 60);
  return '= ' + dinhDangTien(r.so) + (n && n > 1 ? ' × ' + n + ' kỳ = ' + dinhDangTien(r.so * n) : '');
}

/* ---- chia kỳ trong hộp ghi khoản ---- */

function coTheChiaKy(du, nhap) {
  if (!nhap || nhap.sua || nhap.thu || nhap.loai !== 'chi') return false;
  var tk = timTk(du, nhap.taiKhoan);
  return !!tk && laTkNo(tk.loai);
}

function kiemChiaKy(nhap, soTien) {
  var c = nhap.chiaKy || {};
  var soKy = soNguyenChu(c.chuSoKy, 2, 60);
  if (soKy === null) return { loi: 'Số kỳ từ 2 đến 60.' };
  if (!ngayHopLe(c.han)) return { loi: 'Chọn ngày trả kỳ đầu.' };
  var tienKy = 0;
  if (String(c.chuSoTienKy || '').trim() !== '') {
    var r = docSoTien(c.chuSoTienKy);
    if (r.loi) return { loi: 'Mỗi kỳ: ' + r.loi };
    tienKy = r.so;
  }
  if (tienKy && soTien && tienKy * soKy < soTien) return { loi: 'Tổng các kỳ không được nhỏ hơn giá món.' };
  return { chiaKy: { soKy: soKy, hanDau: c.han, soTienKy: tienKy } };
}

function phanXemChia(nhap) {
  if (nhap.loi && nhap.loi.chiaKy) return dongLoi(nhap, 'chiaKy');
  var tien = docSoTien(nhap.chuSoTien).so;
  var r = kiemChiaKy(nhap, tien);
  if (!r.chiaKy || !tien) return '';
  var c = r.chiaKy;
  var moiKy = c.soTienKy || Math.floor(tien / c.soKy);
  var h = '= ' + c.soKy + ' kỳ × ' + dinhDangTien(moiKy) + ', kỳ đầu ' + chuNgayDayDu(c.hanDau);
  if (c.soTienKy && c.soTienKy * c.soKy > tien) h += '<div class="chenh-so">Trả thêm ' + dinhDangTien(c.soTienKy * c.soKy - tien) + ' phí & lãi so với giá món.</div>';
  return h + '<div class="nhan-nho">Chi tháng này vẫn tính đủ ' + dinhDangTien(tien) + '.</div>';
}

function dungChiaKy(du, nhap) {
  var c = nhap.chiaKy || {};
  var bat = !!c.bat;
  var h = '<div class="nhom-nhap"><button class="nut' + (bat ? ' chon' : '') + '" type="button" data-hd="chia-bat" aria-pressed="' + (bat ? 'true' : 'false') + '">' +
    (bat ? '✓ ' : '') + '🗓️ Trả góp / chia kỳ</button>';
  if (!bat) return h + '</div>';
  return h + '<div class="chia-ky">' +
    '<label class="nhan-hang" for="o-chia-so">Số kỳ</label>' +
    '<input id="o-chia-so" class="o" type="text" inputmode="numeric" autocomplete="off" placeholder="Ví dụ 6" value="' + thoatHtml(c.chuSoKy) + '">' +
    '<label class="nhan-hang" for="o-chia-han">Ngày trả kỳ đầu</label>' +
    '<input id="o-chia-han" class="o" type="date" value="' + thoatHtml(c.han) + '">' +
    '<label class="nhan-hang" for="o-chia-tien">Mỗi kỳ trả (bỏ trống = chia đều giá món)</label>' +
    '<input id="o-chia-tien" class="o" type="text" inputmode="decimal" autocomplete="off" placeholder="Ví dụ 2tr1" value="' + thoatHtml(c.chuSoTienKy) + '">' +
    '<div id="xem-chia" class="xem-tien" aria-live="polite">' + phanXemChia(nhap) + '</div></div></div>';
}

/* ---- chạm document ---- */

function veHopNo() {
  if (typeof document === 'undefined' || (!NHAP_TRA && !NHAP_LICH)) return;
  var lop = document.getElementById('lop-phu');
  if (!lop) return;
  var cu = lop.querySelector('.hop');
  var cuon = cu ? cu.scrollTop : 0;
  lop.innerHTML = NHAP_TRA ? dungHopTra(TT.duLieu, NHAP_TRA) : dungHopLich(TT.duLieu, NHAP_LICH);
  var moi = lop.querySelector('.hop');
  if (moi) moi.scrollTop = cuon;
}

function dongHopNo() {
  NHAP_TRA = null;
  NHAP_LICH = null;
  dongHop();
}

function dangMoHopKhac() {
  return !!(NHAP || NHAP_TK || NHAP_NS || NHAP_TRA || NHAP_LICH);
}

function moHopTra(ma) {
  var du = TT.duLieu;
  if (!du || dangMoHopKhac()) return '';
  var m = timMucTra(du, ma);
  if (!m || m.daTra) return '';
  NHAP_TRA = nhapTra(du, m);
  var html = dungHopTra(du, NHAP_TRA);
  moHop(html);
  return html;
}

function moHopLich(maTk) {
  var du = TT.duLieu;
  if (!du || dangMoHopKhac() || !timTk(du, maTk)) return '';
  NHAP_LICH = nhapLich(du, maTk);
  var html = dungHopLich(du, NHAP_LICH);
  moHop(html);
  return html;
}

function hongNo(nhap, cau) {
  nhap.dangLuu = false;
  nhap.loiLuu = 'Chưa lưu được: ' + cauNgan(cau) + '.';
  if (NHAP_TRA === nhap || NHAP_LICH === nhap) {
    veHopNo();
    if (typeof document !== 'undefined') {
      var el = document.getElementById('loi-luu');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }
  }
}

function luuTra() {
  var nhap = NHAP_TRA;
  if (!nhap || nhap.dangLuu) return;
  var r = kiemTra(TT.duLieu, nhap);
  if (!r.t) { nhap.loi = r.loi; nhap.loiLuu = ''; veHopNo(); return; }
  nhap.loi = {};
  nhap.loiLuu = '';
  nhap.dangLuu = true;
  veHopNo();
  goiMay('api_traNo', [nhap.ma, r.t, TT.ky], function (kq) {
    nhap.dangLuu = false;
    if (!kq || typeof kq !== 'object' || !kq.ky) { hongNo(nhap, CHU_MAT_MANG); return; }
    nhanDuLieuMoi(kq);
    if (NHAP_TRA === nhap) dongHopNo();
    baoNhanh('Đã ghi trả ' + dinhDangTien(r.t.soTien) + ' · ' + nhap.tenTk);
  }, function (cau) { hongNo(nhap, cau); });
}

/* Gọi máy cho hộp lịch; xong thì giữ hộp mở, vẽ lại theo dữ liệu mới */
function goiLich(nhap, ten, thamSo, chu, sauKhiXong) {
  nhap.loiLuu = '';
  nhap.dangLuu = true;
  veHopNo();
  goiMay(ten, thamSo, function (kq) {
    nhap.dangLuu = false;
    if (!kq || typeof kq !== 'object' || !kq.ky) { hongNo(nhap, CHU_MAT_MANG); return; }
    if (sauKhiXong) sauKhiXong();
    nhanDuLieuMoi(kq);
    if (NHAP_LICH === nhap) veHopNo();
    baoNhanh(chu);
  }, function (cau) { hongNo(nhap, cau); });
}

function themKyLich() {
  var nhap = NHAP_LICH;
  if (!nhap || nhap.dangLuu) return;
  var r = kiemThemKy(nhap);
  if (!r.ky) { nhap.loi = r.loi; nhap.loiLuu = ''; veHopNo(); return; }
  nhap.loi = {};
  goiLich(nhap, 'api_themKy', [nhap.maTk, r.ky, TT.ky], 'Đã thêm ' + r.ky.soKy + ' kỳ vào lịch trả', function () {
    nhap.chuHan = ''; nhap.chuSoTien = ''; nhap.chuSoKy = '1'; nhap.noiDung = '';
  });
}

function xoaKyLich(ma) {
  var nhap = NHAP_LICH;
  if (!nhap || nhap.dangLuu || !ma) return;
  goiLich(nhap, 'api_xoaKy', [ma, TT.ky], 'Đã xoá kỳ');
}

function luuNgayThe() {
  var nhap = NHAP_LICH;
  if (!nhap || nhap.dangLuu) return;
  var n = soNguyenChu(nhap.chuNgayThe, 0, 31);
  if (n === null) { nhap.loi = { ngayThe: 'Gõ ngày từ 1 đến 31 (0 để bỏ).' }; veHopNo(); return; }
  nhap.loi = {};
  goiLich(nhap, 'api_datHanThe', [nhap.maTk, n, TT.ky], n ? 'Đã lưu ngày trả thẻ: ngày ' + n + ' hằng tháng' : 'Đã bỏ ngày trả thẻ');
}

function xuLyBamNo(hd, el) {
  var ma = el.getAttribute('data-ma') || '';
  if (hd === 'tra-mo') { moHopTra(ma); return; }
  if (hd === 'lich-mo') { moHopLich(ma); return; }
  if (hd === 'chia-bat') {
    var n = NHAP;
    if (!n) return;
    var c = n.chiaKy || (n.chiaKy = { bat: false, chuSoKy: '', han: '', chuSoTienKy: '' });
    c.bat = !c.bat;
    if (c.bat && !c.han && ngayHopLe(n.ngay)) c.han = kyKe(n.ngay.slice(0, 7), 1) + '-' + n.ngay.slice(8, 10);
    if (c.bat && !ngayHopLe(c.han)) c.han = '';
    if (n.loi) delete n.loi.chiaKy;
    veHop();
    return;
  }
  if (hd === 'tra-dong' || hd === 'lich-dong') { dongHopNo(); return; }
  if (NHAP_TRA) {
    if (hd === 'tra-luu') luuTra();
    else if (hd === 'tra-tk') { NHAP_TRA.tuTk = ma; if (NHAP_TRA.loi) delete NHAP_TRA.loi.tuTk; veHopNo(); }
  } else if (NHAP_LICH) {
    if (hd === 'lich-them') themKyLich();
    else if (hd === 'lich-xoa') xoaKyLich(ma);
    else if (hd === 'lich-han') luuNgayThe();
  }
}

function xuLyNhapNo(e) {
  var el = e.target;
  if (!el || !el.id) return;
  if (NHAP && NHAP.chiaKy && /^o-chia-/.test(el.id)) {
    var c = NHAP.chiaKy;
    if (el.id === 'o-chia-so') c.chuSoKy = el.value;
    else if (el.id === 'o-chia-han') c.han = el.value;
    else if (el.id === 'o-chia-tien') c.chuSoTienKy = el.value;
    if (NHAP.loi) delete NHAP.loi.chiaKy;
    var x = document.getElementById('xem-chia');
    if (x) x.innerHTML = phanXemChia(NHAP);
    return;
  }
  if (NHAP && el.id === 'o-tien' && NHAP.chiaKy && NHAP.chiaKy.bat) {
    var xc = document.getElementById('xem-chia');
    if (xc) xc.innerHTML = phanXemChia(NHAP);
  }
  if (NHAP_TRA) {
    if (el.id === 'o-tra-tien') {
      NHAP_TRA.chuSoTien = el.value;
      if (NHAP_TRA.loi) delete NHAP_TRA.loi.soTien;
      var xt = document.getElementById('xem-tra-tien');
      if (xt) xt.innerHTML = phanXemTra(NHAP_TRA);
    } else if (el.id === 'o-tra-ngay') {
      NHAP_TRA.ngay = el.value;
    }
  } else if (NHAP_LICH) {
    var n = NHAP_LICH;
    if (el.id === 'o-lich-han') n.chuHan = el.value;
    else if (el.id === 'o-lich-tien') n.chuSoTien = el.value;
    else if (el.id === 'o-lich-soky') n.chuSoKy = el.value;
    else if (el.id === 'o-lich-nd') n.noiDung = el.value;
    else if (el.id === 'o-lich-ngay-the') n.chuNgayThe = el.value;
    else if (el.id === 'o-lich-cong') n.congVaoNo = !!el.checked;
    else return;
    if (el.id === 'o-lich-tien' || el.id === 'o-lich-soky') {
      if (n.loi) { delete n.loi.soTien; delete n.loi.soKy; }
      var xl = document.getElementById('xem-lich-tien');
      if (xl) xl.innerHTML = phanXemLich(n);
    }
  }
}

function xuLyBam(e) {
  var el = e.target;
  while (el && el !== document && !(el.getAttribute && el.getAttribute('data-hd'))) el = el.parentNode;
  if (!el || el === document) return;
  var hd = el.getAttribute('data-hd');
  if (hd === 'truoc' || hd === 'sau') {
    if (TT.dangTai || !TT.ky) return;
    taiThang(kyKe(TT.ky, hd === 'truoc' ? -1 : 1));
  } else if (hd === 'thu-lai') {
    taiThang(KY_LAY);
  } else if (hd === 'chon-nhom') {
    var nhom = el.getAttribute('data-nhom') || '';
    TT.locNhom = TT.locNhom === nhom ? '' : nhom;
    veLai();
  } else if (hd === 'bo-loc') {
    TT.locNhom = '';
    veLai();
  } else if (hd === 'tk-bat') {
    MO_TK = !MO_TK;
    veLai();
  } else if (HD_NO.indexOf(hd) >= 0) {
    xuLyBamNo(hd, el); /* mốc 3 */
  } else if (HD_TK.indexOf(hd) >= 0) {
    xuLyBamTk(hd, el);
  } else if (HD_BC.indexOf(hd) >= 0) {
    xuLyBamBc(hd, el);
  } else {
    xuLyBamGhi(hd, el);
  }
}

if (typeof document !== 'undefined') {
  document.addEventListener('click', xuLyBam);
  document.addEventListener('input', xuLyNhap);
  document.addEventListener('change', xuLyNhap);
  document.addEventListener('input', xuLyNhapTk);
  document.addEventListener('change', xuLyNhapTk);
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && NHAP_TK) { e.preventDefault(); dongHopTk(); }
  });
  document.addEventListener('input', xuLyNhapLoc);
  document.addEventListener('input', xuLyNhapNo);
  document.addEventListener('change', xuLyNhapNo);
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && (NHAP_TRA || NHAP_LICH)) { e.preventDefault(); dongHopNo(); }
  });
  document.addEventListener('input', xuLyNhapNs);
  document.addEventListener('focusout', xuLyRoiNs);
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && NHAP_NS) { e.preventDefault(); dongHopNs(); }
  });
  document.addEventListener('focusout', function (e) {
    if (NHAP && e.target && e.target.id === 'o-tien') { NHAP.daRoiTien = true; capNhatXemTien(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && NHAP) { e.preventDefault(); yeuCauDong(); }
  });
  veLai();
  taiThang('');
}
</script>
